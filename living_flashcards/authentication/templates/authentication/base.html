{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"> <!--right now this uses bootstrap-->
    <link rel="stylesheet" href="{% static 'auth.css' %}"> <!--delete the bootstrap styling when this is started-->
        <title>{% block title %}Living Flashcards{% endblock %}</title>
    </head>
    <body>
        <nav class="navbar navbar-expanded-lg navbar-dark bg-dark">
            <ul class="navbar-nav">
                <!--copilot code to only display logout button when user is logged in-->
                {% if user.is_authenticated %}
                <li class="nav-item"><a class="nav-link" href="{% url 'all_decks' %}">Home</a></li>
                <li class="nav-item">
                    <form method="post" action="{% url 'logout' %}" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link nav-link" style="display: inline; padding: 0; border: none;">Logout</button>
                    </form>
                </li>
                {% else %}
                <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'authentication:sign-up' %}">Sign up</a></li>
                {% endif %}
            </ul>
        </nav>
        <div class="container">
            {% block content %}
            <p>If you already have an account on Living Flashcards: </p>
            <button href="/login">Log in</button>
            <p>Or if you don't</p>
            <a href="{% url 'authentication:sign-up' %}"><button>Sign up</button></a>
            {% endblock %}
        </div>
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
