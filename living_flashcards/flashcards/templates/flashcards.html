{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Living Flashcards</title>
    <link rel="stylesheet" href="{% static 'flashcards.css' %}">
</head>
<body>
    <header>
    <!-- Header with home and profile buttons -->

    <!-- Progress bar showing progress through flashcards -->
    </header>
    <h3>{{deck_info.name_in_lang}} ({{deck_info.name}})</h3>

    <div class="deck">
      {% for card in to_review %}
          <div class="card">
            <p class="card-word">{{card.term}}</p>
            <p class="card-definition">{{card.definition}}</p>
          </div>
      {% endfor %}
      {% for card in new %}
          <div class="card">
            <p class="card-word">{{card.term}}</p>
            <p class="card-definition">{{card.definition}}</p>
          </div>
      {% endfor %}
    </div>

    {% comment %}
 <!-- Need to make buttons like Anki's -->
    <div class="btn-container">
      <button class="anki-btn">Again</button>
      <button class="anki-btn">Hard</button>
      <button class="anki-btn">Good</button>
      <button class="anki-btn">Easy</button>
    </div>
      
<!-- Language Toggle --> 
    <footer class="controls">
      
      <div class="lang-btn-container">
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-input"/>
          <span class="slider"></span>
          <span class="toggle-label">Sora-English</span>
        </label>
      </div>

    </footer>
    {% endcomment %}

    <script src="{% static 'flashcards.js' %}"></script>
</body>
</html>
