{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Living Flashcards</title>
    <link rel="stylesheet" href="{% static 'flashcards.css' %}">
</head>
<body>
    <header>
    <!-- Header with home and profile buttons -->

    <!-- Progress bar showing progress through flashcards -->
    </header>
    <h3>{{deck_info.name_in_lang}} ({{deck_info.name}})</h3>

    {% if card %}
      <p class="card">{{ card.card_id.term }} ({{ card.card_id.definition }})</p>
    {% else %}
      <p>No cards to review.</p>
      <a href="/" class="button-link">Go home</a>
    {% endif %}

 <!-- Need to make buttons like Anki's -->
  <!--rn this 100% doesn't follow best-conventions-->
  {% if card %}
  <form action="{% url 'flashcards:review_card' %}" method="post">
    <!--security thing so db doesn't get mad-->
    {% csrf_token %}
    <input type="hidden" name="card_id" value="{{ card.card_id.card_id }}"> <!--this is the id for the cardtouser object which is the object storing a specific card's data for a specific user-->
    <button type="submit" name="rating" value="again">Again: {{review_intervals.again}}</button>
    <button type="submit" name="rating" value="hard">Hard: {{review_intervals.hard}}</button>
    <button type="submit" name="rating" value="good">Good: {{review_intervals.good}}</button>
    <button type="submit" name="rating" value="easy">Easy: {{review_intervals.easy}}</button>
  </form>
  {% endif %}

    <script src="{% static 'flashcards.js' %}"></script>
</body>
</html>
