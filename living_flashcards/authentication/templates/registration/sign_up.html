{% extends 'authentication/auth_base.html' %}
{% block title %}Sign Up{% endblock %}
{% load crispy_forms_tags %}
{% block content %}
{% load static %}
{% load static %}
<!-- Claude Generated Code with Prompts from our Figma Designs -->
<style>
  .lf-form .form-group, .lf-form .mb-3 { margin-bottom: 1.1rem; }
  .lf-form label { display: block; font-size: 14px; color: #5F5E5A; margin-bottom: 6px; font-weight: 400; font-family: 'Inter', sans-serif; }
  .lf-form .form-control { width: 100%; box-sizing: border-box; padding: 11px 14px; border-radius: 8px; border: 1px solid #D3D1C7; background: #ffffff; font-size: 16px; color: #2C2C2A; outline: none; box-shadow: none; font-family: 'Inter', sans-serif; }
  .lf-form .form-control:focus { border-color: #739F7F; box-shadow: 0 0 0 3px rgba(115,159,127,0.15); }
  .lf-form .form-control::placeholder { color: #B4B2A9; }
  .lf-form .invalid-feedback, .lf-form .errorlist { font-size: 12px; color: #993C1D; margin-top: 4px; }
  .lf-form .form-control.is-invalid { border-color: #993C1D; }
  /* Hide Django's default helper text */
  .lf-form .helptext, .lf-form small { display: none; }
</style>

<div style="font-family: 'Inter', sans-serif; height: 100vh; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; box-sizing: border-box; overflow: hidden;">

  <img src="{% static 'LF_logo.svg' %}" alt="Living Flashcards logo" style="width: 72px; height: 72px; margin-bottom: 1rem;">

  <h1 style="font-size: 32px; font-weight: 700; color: #2C2C2A; margin: 0 0 1.75rem; letter-spacing: -0.5px;">Living Flashcards</h1>

  <div style="background: #F2F2ED; border-radius: 16px; padding: 2.25rem 2.5rem; width: 100%; max-width: 480px; box-sizing: border-box;">

    <form method="post">
      {% csrf_token %}
      <div class="lf-form">
        {{ form|crispy }}
      </div>

      <button type="submit" style="width: 100%; padding: 0.75rem 1rem; background: #739F7F; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 0.25rem; font-family: 'Inter', sans-serif;">
        Register
      </button>
    </form>

    <p style="font-size: 13px; color: #5F5E5A; text-align: center; margin: 1.25rem 0 0; font-family: 'Inter', sans-serif;">
      Have an account? <a href="/login" style="color: #739F7F; text-decoration: none; font-weight: 500;">Log in</a>
    </p>

  </div>
</div>
{% endblock %}
