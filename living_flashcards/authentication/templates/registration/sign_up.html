{% extends 'authentication/auth_base.html' %}
{% block title %}Sign Up{% endblock %}
{% load crispy_forms_tags %}
{% block content %}
{% load static %}
<style>
</style>

<div class="auth-container">
  <div class="auth-card">
    <h1>Sign Up</h1>

    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}

      <button type="submit">Register</button>
    </form>

    <p>
      Have an account? Log in <a href="/login">here</a>
    </p>
  </div>
</div>
{% endblock %}
