{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Living Flashcards</title>
    <link rel="stylesheet" href="{% static 'flashcards.css' %}">
</head>
<body>
    <header>
    <!-- Header with home and profile buttons -->

    <!-- Progress bar showing progress through flashcards -->
    </header>
    <h3>{{deck_info.name_in_lang}} ({{deck_info.name}})</h3>

    <div class="deck">
      {% for card in to_review %}
          <div class="card">
            <p class="card-word">{{card.term}}</p>
            <p class="card-definition">{{card.definition}}</p>
          </div>
      {% endfor %}
      {% for card in new %}
          <div class="card">
            <p class="card-word">{{card.term}}</p>
            <p class="card-definition">{{card.definition}}</p>
          </div>
      {% endfor %}
    </div>

 <!-- Need to make buttons like Anki's -->
  <!--rn this 100% doesn't follow best-conventions-->
  <form action="{% url 'flashcards:review_card' %}" method="POST">
    <!--security thing-->
    {% csrf_token %}
    <div class="btn-container">
      <button type="submit" name="rating" value="again" class="anki-btn">Again</button>
      <button type="submit" name="rating" value="hard" class="anki-btn">Hard</button>
      <button type="submit" name="rating" value="good" class="anki-btn">Good</button>
      <button type="submit" name="rating" value="easy" class="anki-btn">Easy</button>
    </div>
    <input type="hidden" name="card_id" value="{{ card_id }}">
  </form>
      
<!-- Language Toggle --> 
    <footer class="controls">
      
      <div class="lang-btn-container">
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-input"/>
          <span class="slider"></span>
          <span class="toggle-label">Sora-English</span>
        </label>
      </div>

    </footer>

    <script src="{% static 'flashcards.js' %}"></script>
</body>
</html>
